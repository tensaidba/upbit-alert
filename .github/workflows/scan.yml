name: Upbit Signal Scanner

# Hourly. The rule is defined on 4h bar closes, so three of every four runs find
# nothing new by design -- they exist because GitHub's scheduled runs get delayed
# and skipped (observed: 4 of 6 fired, up to ~3h late). Running hourly plus the
# CATCHUP_BARS re-check in scan.py means a signal survives several missed runs;
# sent.json keeps the overlap from re-alerting.
#
# A run now takes ~15 min, so an hourly schedule still leaves the concurrency group
# clear between runs -- runs queue rather than overlap (cancel-in-progress: false).
on:
  schedule:
    # Two attempts an hour, both off the top of the hour. GitHub drops scheduled
    # runs when its queue is busy and :00 is the worst minute for that; measured
    # 2026-09-13..25 a single ':06' cron actually fired 5-7 times a DAY, not 24.
    # Two staggered attempts cannot force a run, but each one is an independent
    # chance, so the expected gap between real runs shrinks.
    - cron: '6 * * * *'
    - cron: '34 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: '진단: 신호가 없어도 텔레그램으로 스캔 결과를 보냅니다 (Secret 연결 확인용)'
        type: boolean
        default: false

concurrency:
  group: upbit-scan
  cancel-in-progress: false

permissions:
  contents: write   # to commit sent.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    # One job stays alive for ~5.5h and scans on every hour boundary, instead of
    # one scan per scheduled run. GitHub's scheduler is best-effort -- a single
    # cron fired 5-7 times a DAY (measured 2026-09-13..25), so signals sat unsent
    # for hours -- and it cannot be made reliable. This inverts the dependency:
    # the scheduler only has to START a session, and the session itself supplies
    # the hourly cadence. The concurrency group keeps one run active and one
    # queued, so the moment a session ends the queued one takes over; as long as
    # a cron fires once per 5.5h window (they average one per 3.4-4.8h) the chain
    # does not break. A scan is ~10 min, so the job idles most of each hour.
    timeout-minutes: 350   # must exceed the 5.5h session; GitHub caps a job at 6h
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the loop rebases before each push, and a shallow clone
          # cannot rebase onto commits it never fetched.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hourly scan session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test_alert }}
          # TEMPORARY: confirmation message on every run, to see which hours really
          # fire. Set repo variable PING_EVERY_RUN to 'false' to stop it without a
          # commit (Settings -> Secrets and variables -> Actions -> Variables).
          PING_EVERY_RUN: ${{ vars.PING_EVERY_RUN || 'true' }}
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SESSION_END=$(( $(date +%s) + 5*3600 + 1800 ))
          while :; do
            echo "::group::scan at $(date -u +%H:%M) UTC"
            python scan.py
            echo "scan.py exit=$?"
            echo "::endgroup::"

            # Persist inside the loop, not once at the end: a session lasting hours
            # would otherwise hold the dedup ledger in memory, and a crash or the
            # 6h cap would lose every signal it had already alerted -- which the
            # next session would then alert again.
            if [[ -n "$(git status --porcelain sent.json heartbeat.json ranking.json)" ]]; then
              git add sent.json heartbeat.json ranking.json
              git commit -q -m "chore: update alert ledger [skip ci]"
              # A local run on the user's PC pushes the same ledgers, so rebase
              # before pushing or the two paths fork the dedup history.
              git pull --rebase -q && git push -q && echo "ledgers pushed" || echo "ledger push FAILED"
            else
              echo "ledgers unchanged"
            fi

            # Wake at :06 past the next hour, matching the cron minute.
            NOW=$(date +%s)
            NEXT=$(( NOW - NOW % 3600 + 3600 + 360 ))
            if [[ $NEXT -ge $SESSION_END ]]; then
              echo "session window over; exiting so the queued run takes the next hour"
              break
            fi
            echo "sleeping $(( NEXT - NOW ))s until $(date -u -d @$NEXT +%H:%M) UTC"
            sleep $(( NEXT - NOW ))
          done

      # Persist the dedup ledger and the daily-report date. Without heartbeat.json
      # surviving the run, daily_report_due() is true again on the next run and the
      # status report goes out every hour instead of once a day. ranking.json is
      # here for the same reason: if it does not survive, every run pays the ~285
      # daily-candle requests again to rebuild an identical list.
      - name: Persist ledgers
        if: always()
        run: |
          if [[ -n "$(git status --porcelain sent.json heartbeat.json ranking.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent.json heartbeat.json ranking.json
            git commit -m "chore: update alert ledger [skip ci]"
            git push
          else
            echo "ledgers unchanged"
          fi
